<style>
:root{
  --ink:#171914;
  --paper:#f7f5ee;
  --yellow:#e9c83d;
  --yellow-strong:#d9b72a;
  --green:#4d5a3d;
  --line:#e3dfd0;
  --muted:#6f7163;
  --card:#ffffff;
  --bg-soft:#f0ede2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Roboto','Oxygen',
    'Ubuntu','Cantarell','Fira Sans','Droid Sans','Helvetica Neue',
    sans-serif;line-height:1.6;font-size:14px}
.hidden{display:none!important}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#f8f5ec,#e7e3d3)}
.login-card{width:min(460px,100%);background:linear-gradient(180deg,#fffdf7 0%,var(--paper) 100%);padding:clamp(32px,6vw,56px);box-shadow:0 40px 80px -60px rgba(23,25,20,.8);border:1px solid rgba(23,25,20,.08);position:relative;overflow:hidden}
.login-card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at top right,rgba(233,200,61,.18),transparent 55%);pointer-events:none}
.login-card>*{position:relative;z-index:1}
.mark{width:52px;height:52px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;margin-bottom:28px;box-shadow:inset 0 0 0 1px rgba(233,200,61,.25);overflow:hidden}
.mark img{width:100%;height:100%;object-fit:cover}
.mark span{color:#b79817}
.eyebrow{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--green);font-weight:600;margin:0}
.login-card h1{font-size:clamp(40px,8vw,58px);line-height:.95;margin:16px 0 32px;letter-spacing:-.04em;font-weight:800}
.login-card h1 em{font-family:Georgia,serif;font-weight:400;font-style:italic;color:var(--green)}
.login-card label{display:block;font-size:10px;letter-spacing:.28em;text-transform:uppercase;margin-bottom:10px;color:var(--muted)}
.login-card input{width:100%;padding:14px 16px;border:1px solid var(--line);background:rgba(255,253,247,.9);outline:none;font:inherit;font-size:14px;border-radius:12px;transition:border .2s ease,box-shadow .2s ease}
.login-card input:focus{border-color:rgba(233,200,61,.9);box-shadow:0 0 0 4px rgba(233,200,61,.18)}
.login-card button,.primary{margin-top:18px;background:linear-gradient(135deg,var(--ink) 0%,#262820 100%);color:#f7f5ee;border:0;padding:14px 22px;font-weight:600;cursor:pointer;border-radius:999px;display:inline-flex;align-items:center;gap:8px;letter-spacing:.08em;text-transform:uppercase;font-size:11px;transition:transform .2s ease,box-shadow .2s ease}
.login-card button:hover,.primary:hover{transform:translateY(-1px);box-shadow:0 18px 40px -30px rgba(23,25,20,.9)}
.error{font-size:12px;color:#b63b2b;margin-top:12px}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
.sidebar{background:radial-gradient(circle at top,var(--ink),#10120d);color:#f7f5ee;padding:32px 26px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side-brand{display:flex;align-items:center;gap:14px;font-size:12px;letter-spacing:.28em;text-transform:uppercase}
.side-brand .mark{width:42px;height:42px;border-color:rgba(247,245,238,.4);margin:0;color:var(--yellow);box-shadow:none;overflow:hidden}
.side-brand .mark img{width:100%;height:100%;object-fit:cover}
.side-brand b{display:flex;flex-direction:column;gap:6px;font-weight:700}
.side-brand small{display:block;font-size:9px;color:rgba(247,245,238,.5);letter-spacing:.4em}
.sidebar nav{display:grid;gap:6px;margin-top:48px}
.sidebar nav button,.side-bottom button{border:0;background:transparent;color:rgba(247,245,238,.6);text-align:left;padding:12px 14px;font-size:13px;cursor:pointer;border-radius:999px;display:flex;align-items:center;gap:10px;transition:all .2s ease;font-weight:500}
.sidebar nav button:before{content:"";width:6px;height:6px;border-radius:50%;background:transparent;transition:background .2s ease}
.sidebar nav button.active{background:linear-gradient(90deg,rgba(233,200,61,.22) 0%,transparent 100%);color:var(--yellow)}
.sidebar nav button.active:before{background:var(--yellow);box-shadow:0 0 0 6px rgba(233,200,61,.12)}
.sidebar nav button:hover{color:#f7f5ee}
.side-bottom{margin-top:auto;display:grid;gap:12px}
.side-bottom span{font-size:9px;letter-spacing:.32em;text-transform:uppercase;color:rgba(247,245,238,.4)}
.side-bottom button{padding-left:14px;color:#f7f5ee}
.main{padding:clamp(24px,5vw,56px);width:100%}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:1px solid var(--line);padding-bottom:28px;margin-bottom:36px;flex-wrap:wrap}
.topbar h2{font-size:clamp(28px,4vw,42px);margin:10px 0 0;letter-spacing:-.03em;font-weight:800}
.live-dot{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;gap:10px;margin-top:12px}
.live-dot:before{content:"";width:8px;height:8px;background:linear-gradient(135deg,#9fb66a,#7c9b57);border-radius:50%;box-shadow:0 0 0 8px rgba(124,155,87,.12)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.stat{background:var(--card);padding:clamp(20px,4vw,28px);border-radius:18px;border:1px solid rgba(23,25,20,.08);box-shadow:0 40px 70px -60px rgba(23,25,20,.9);display:grid;gap:12px}
.stat span{font-size:10px;color:var(--muted);letter-spacing:.28em;text-transform:uppercase}
.stat b{display:block;font-size:clamp(32px,6vw,46px);letter-spacing:-.04em}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin:8px 0 24px;gap:16px;flex-wrap:wrap}
.panel-head h3{font-size:clamp(18px,2vw,24px);margin:0;letter-spacing:-.02em}
.table-wrap{overflow:auto;background:var(--card);border:1px solid rgba(23,25,20,.08);border-radius:18px;box-shadow:0 60px 80px -70px rgba(23,25,20,.9)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:720px}
th,td{text-align:left;padding:16px 22px;border-bottom:1px solid rgba(227,223,208,.8)}
th{font-size:10px;color:var(--muted);letter-spacing:.28em;text-transform:uppercase;background:linear-gradient(180deg,#fbf9f3 0%,var(--card) 100%)}
tbody tr:hover td{background:rgba(233,200,61,.08)}
td button{border:0;background:none;color:var(--ink);text-decoration:none;font-size:12px;margin-right:12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;position:relative}
td button:after{content:"";position:absolute;left:0;bottom:-4px;width:100%;height:1px;background:linear-gradient(90deg,var(--yellow),transparent);transform:scaleX(0);transform-origin:left;transition:transform .2s ease}
td button:hover:after{transform:scaleX(1)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.field{display:grid;gap:9px}
.field label{margin:0;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:14px 16px;border:1px solid var(--line);background:rgba(255,253,247,.95);outline:none;font:inherit;font-size:14px;border-radius:12px;transition:border .2s ease,box-shadow .2s ease}
.field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(233,200,61,.9);box-shadow:0 0 0 4px rgba(233,200,61,.16)}
.field textarea{min-height:120px;resize:vertical;line-height:1.8}
.field.full{grid-column:1/-1}
.form-card{background:var(--card);padding:clamp(22px,4vw,34px);margin-bottom:28px;border-radius:20px;border:1px solid rgba(23,25,20,.08);box-shadow:0 70px 90px -80px rgba(23,25,20,.95);display:grid;gap:22px}
.form-card h3{margin:0;font-size:clamp(18px,2vw,26px);letter-spacing:-.02em}
.actions{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
.secondary{border:1px solid rgba(23,25,20,.16);background:transparent;padding:13px 20px;cursor:pointer;border-radius:999px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:11px;display:inline-flex;align-items:center;gap:8px;transition:all .2s ease}
.secondary:hover{border-color:var(--ink)}
.notice{font-size:13px;color:var(--muted);margin:0}
.settings-grid{max-width:880px}
@media(max-width:1080px){.app{grid-template-columns:240px 1fr}}
@media(max-width:920px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto;flex-direction:row;align-items:center;gap:18px;flex-wrap:wrap}.side-brand{margin-right:auto}.sidebar nav{margin:0;display:flex;overflow:auto;padding:4px;gap:4px;border-radius:999px;background:rgba(247,245,238,.08)}.sidebar nav button{white-space:nowrap;padding:10px 16px}.side-bottom{display:none}.main{padding:clamp(18px,4vw,28px)}}
@media(max-width:680px){.form-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.table-wrap{border-radius:14px}table{min-width:620px}.panel-head{align-items:flex-start}.login-card{padding:28px 24px}}
</style>
