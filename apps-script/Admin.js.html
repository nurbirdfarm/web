<script>
let PIN='',DATA={};
const $=s=>document.querySelector(s);
function call(fn,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||e)))[fn](...args))}
$('#loginBtn').onclick=login;
$('#pinInput').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
async function login(){
  try{
    PIN=$('#pinInput').value.trim();
    if(!PIN){$('#loginError').textContent='Masukkan PIN terlebih dahulu.';return;}
    await call('adminLogin',PIN);
    $('#login').classList.add('hidden');
    $('#app').classList.remove('hidden');
    $('#loginError').textContent='';
    await refresh();
  }catch(e){$('#loginError').textContent=e.message||'PIN tidak valid.'}
}
async function refresh(){
  try{
    DATA=await call('adminData',PIN);
    if(!DATA) DATA={};
    // ensure arrays exist
    if(!Array.isArray(DATA.products)) DATA.products=[];
    if(!Array.isArray(DATA.articles)) DATA.articles=[];
    if(!Array.isArray(DATA.gallery)) DATA.gallery=[];
    if(!Array.isArray(DATA.testimonials)) DATA.testimonials=[];
    render(document.querySelector('#sideNav .active')?.dataset.view||'dashboard');
  }catch(e){alert('Gagal memuat data: '+(e.message||e));}
}
$('#logoutBtn').onclick=()=>{
  PIN='';
  $('#app').classList.add('hidden');
  $('#login').classList.remove('hidden');
  $('#pinInput').value='';
  $('#loginError').textContent='';
};
$('#sideNav').onclick=e=>{
  const b=e.target.closest('button[data-view]');
  if(b) render(b.dataset.view);
};
function render(view){
  document.querySelectorAll('#sideNav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
  const titles={dashboard:'Ringkasan',PageContent:'Tampilan Website',Products:'Produk',Articles:'Artikel',Gallery:'Galeri',Testimonials:'Testimoni',Settings:'Pengaturan'};
  $('#pageTitle').textContent=titles[view]||view;
  if(view==='dashboard')return dashboard();
  if(view==='Settings')return settings();
  if(view==='PageContent')return pageContent();
  return listView(view);
}
function dashboard(){
  const s=DATA.summary||{products:0,available:0,sold:0,articles:0};
  const prods=DATA.products||[];
  $('#view').innerHTML=`
    <div class="stats">
      <div class="stat"><span>SELURUH PRODUK</span><b>${s.products}</b></div>
      <div class="stat"><span>TERSEDIA</span><b>${s.available}</b></div>
      <div class="stat"><span>TERJUAL</span><b>${s.sold}</b></div>
      <div class="stat"><span>ARTIKEL</span><b>${s.articles}</b></div>
    </div>
    <p class="notice">Perubahan tersimpan langsung ke Google Sheets & Google Drive. Gunakan menu di samping untuk mengelola konten.</p>
    <div class="panel-head">
      <h3>Produk Terbaru</h3>
      <button class="primary" onclick="render('Products')">Kelola Produk ↗</button>
    </div>
    ${table('Products',prods.slice(-6).reverse())}
  `;
}
function listView(sheet){
  const rows=DATA[sheet]||[];
  const labels={Products:'Produk',Articles:'Artikel',Gallery:'Galeri',Testimonials:'Testimoni'};
  $('#view').innerHTML=`
    <div class="panel-head">
      <h3>${labels[sheet]||sheet} — ${rows.length} data</h3>
      <button class="primary" onclick="editForm('${sheet}')">+ Tambah ${labels[sheet]||'Data'}</button>
    </div>
    ${table(sheet,rows)}
  `;
}
function table(sheet,rows){
  if(sheet==='Products'){
    const fields=['name','category','price','status'];
    return `<div class="table-wrap"><table><thead><tr><th>NAMA</th><th>KATEGORI</th><th>HARGA</th><th>STATUS</th><th>AKSI</th></tr></thead><tbody>${
      rows.map(r=>`<tr><td><strong>${escapeHtml(r.name||'-')}</strong></td><td>${escapeHtml(r.category||'-')}</td><td>Rp ${Number(r.price||0).toLocaleString('id-ID')}</td><td>${escapeHtml(r.status||'-')}</td><td><button onclick="editForm('Products','${r.id}')">Ubah</button><button onclick="removeRow('Products','${r.id}')">Hapus</button></td></tr>`).join('')||`<tr><td colspan="5">Belum ada produk. Klik "Tambah Data" untuk menambahkan.</td></tr>`
    }</tbody></table></div>`;
  }
  if(sheet==='Articles'){
    return `<div class="table-wrap"><table><thead><tr><th>JUDUL</th><th>RINGKASAN</th><th>DITAMPILKAN</th><th>AKSI</th></tr></thead><tbody>${
      rows.map(r=>`<tr><td><strong>${escapeHtml(r.title||'-')}</strong></td><td>${escapeHtml((r.excerpt||'').substring(0,80))}${r.excerpt&&r.excerpt.length>80?'...':''}</td><td>${r.published==='true'?'Ya':'Tidak'}</td><td><button onclick="editForm('Articles','${r.id}')">Ubah</button><button onclick="removeRow('Articles','${r.id}')">Hapus</button></td></tr>`).join('')||`<tr><td colspan="4">Belum ada artikel.</td></tr>`
    }</tbody></table></div>`;
  }
  if(sheet==='Gallery'){
    return `<div class="table-wrap"><table><thead><tr><th>JUDUL</th><th>JENIS</th><th>URL</th><th>AKSI</th></tr></thead><tbody>${
      rows.map(r=>`<tr><td><strong>${escapeHtml(r.title||'-')}</strong></td><td>${escapeHtml(r.mediaType||'-')}</td><td>${escapeHtml(r.url||r.fileId||'-')}</td><td><button onclick="editForm('Gallery','${r.id}')">Ubah</button><button onclick="removeRow('Gallery','${r.id}')">Hapus</button></td></tr>`).join('')||`<tr><td colspan="4">Belum ada galeri.</td></tr>`
    }</tbody></table></div>`;
  }
  if(sheet==='Testimonials'){
    return `<div class="table-wrap"><table><thead><tr><th>PELANGGAN</th><th>TESTIMONI</th><th>DITAMPILKAN</th><th>AKSI</th></tr></thead><tbody>${
      rows.map(r=>`<tr><td><strong>${escapeHtml(r.customer||'-')}</strong></td><td>${escapeHtml((r.quote||'').substring(0,90))}${r.quote&&r.quote.length>90?'...':''}</td><td>${r.published==='true'?'Ya':'Tidak'}</td><td><button onclick="editForm('Testimonials','${r.id}')">Ubah</button><button onclick="removeRow('Testimonials','${r.id}')">Hapus</button></td></tr>`).join('')||`<tr><td colspan="4">Belum ada testimoni.</td></tr>`
    }</tbody></table></div>`;
  }
  return `<div class="table-wrap"><table><tbody><tr><td>Tidak ada tampilan tabel untuk modul ini.</td></tr></tbody></table></div>`;
}
function editForm(sheet,id=''){
  if(sheet==='Settings') return settings();
  const rows=DATA[sheet]||[];
  const row=(rows.find(x=>x.id===id))||{};
  if(sheet==='Products'){
    $('#view').innerHTML=`
      <div class="form-card">
        <div class="panel-head" style="margin:0 0 18px">
          <h3>${id?'Ubah Produk':'Tambah Produk'}</h3>
          <button class="secondary" onclick="render('Products')">← Kembali ke Daftar</button>
        </div>
        <div class="form-grid">
          <div class="field"><label>Kategori</label><select id="f_category"><option ${row.category==='kenari'?'selected':''}>kenari</option><option ${row.category==='burung-lain'?'selected':''}>burung-lain</option><option ${row.category==='kandang'?'selected':''}>kandang</option><option ${row.category==='pakan'?'selected':''}>pakan</option><option ${row.category==='perlengkapan'?'selected':''}>perlengkapan</option></select></div>
          <div class="field"><label>Nama Produk</label><input id="f_name" value="${escapeAttr(row.name||'')}"></div>
          <div class="field"><label>Jenis / Ras</label><input id="f_species" value="${escapeAttr(row.species||'')}"></div>
          <div class="field"><label>Kelamin</label><select id="f_sex"><option ${row.sex==='Jantan'?'selected':''}>Jantan</option><option ${row.sex==='Betina'?'selected':''}>Betina</option><option ${row.sex==='—'?'selected':''}>—</option></select></div>
          <div class="field"><label>Usia</label><select id="f_age"><option ${row.age==='Anakan'?'selected':''}>Anakan</option><option ${row.age==='Bongkar'?'selected':''}>Bongkar</option><option ${row.age==='Dewasa'?'selected':''}>Dewasa</option><option ${row.age==='—'?'selected':''}>—</option></select></div>
          <div class="field"><label>Tipe</label><input id="f_type" value="${escapeAttr(row.type||'')}"></div>
          <div class="field"><label>Harga (Rp)</label><input id="f_price" type="number" value="${escapeAttr(row.price??'')}"></div>
          <div class="field"><label>Status</label><select id="f_status"><option ${row.status==='Tersedia'?'selected':''}>Tersedia</option><option ${row.status==='Inden'?'selected':''}>Inden</option><option ${row.status==='Terjual'?'selected':''}>Terjual</option></select></div>
          <div class="field"><label>Unggulan</label><select id="f_featured"><option value="false" ${row.featured!=='true'?'selected':''}>Tidak</option><option value="true" ${row.featured==='true'?'selected':''}>Ya</option></select></div>
          <div class="field full"><label>Deskripsi</label><textarea id="f_description">${escapeHtml(row.description||'')}</textarea></div>
          <div class="field full"><label>Riwayat Indukan</label><textarea id="f_parentage">${escapeHtml(row.parentage||'')}</textarea></div>
          <div class="field full"><label>ID Foto Google Drive (pisahkan koma)</label><input id="f_photoIds" value="${escapeAttr(row.photoIds||'')}"></div>
          <div class="field"><label>URL Video</label><input id="f_videoUrl" value="${escapeAttr(row.videoUrl||'')}"></div>
          <div class="field"><label>URL Suara</label><input id="f_audioUrl" value="${escapeAttr(row.audioUrl||'')}"></div>
        </div>
        <div class="field" style="margin-top:18px">
          <label>Upload Foto Baru (maks 8 MB)</label>
          <input type="file" id="mediaFile" accept="image/*" onchange="previewImg(this)">
          <div id="imgPreview" style="margin-top:12px"></div>
        </div>
        <div class="actions">
          <button class="primary" onclick="saveForm('Products','${id||''}')">Simpan Produk</button>
          <button class="secondary" onclick="render('Products')">Batal</button>
        </div>
      </div>
    `;
    return;
  }
  if(sheet==='Articles'){
    $('#view').innerHTML=`
      <div class="form-card">
        <div class="panel-head" style="margin:0 0 18px">
          <h3>${id?'Ubah Artikel':'Tambah Artikel'}</h3>
          <button class="secondary" onclick="render('Articles')">← Kembali ke Daftar</button>
        </div>
        <div class="form-grid">
          <div class="field full"><label>Judul Artikel</label><input id="f_title" value="${escapeAttr(row.title||'')}"></div>
          <div class="field full"><label>Ringkasan</label><textarea id="f_excerpt">${escapeHtml(row.excerpt||'')}</textarea></div>
          <div class="field full"><label>Isi Artikel</label><textarea id="f_content" style="min-height:200px">${escapeHtml(row.content||'')}</textarea></div>
          <div class="field"><label>Cover ID (Google Drive)</label><input id="f_coverId" value="${escapeAttr(row.coverId||'')}"></div>
          <div class="field"><label>Tampilkan di Publik</label><select id="f_published"><option value="true" ${row.published==='true'?'selected':''}>Ya</option><option value="false" ${row.published!=='true'?'selected':''}>Tidak</option></select></div>
        </div>
        <div class="actions">
          <button class="primary" onclick="saveForm('Articles','${id||''}')">Simpan Artikel</button>
          <button class="secondary" onclick="render('Articles')">Batal</button>
        </div>
      </div>
    `;
    return;
  }
  if(sheet==='Gallery'){
    $('#view').innerHTML=`
      <div class="form-card">
        <div class="panel-head" style="margin:0 0 18px">
          <h3>${id?'Ubah Galeri':'Tambah Galeri'}</h3>
          <button class="secondary" onclick="render('Gallery')">← Kembali ke Daftar</button>
        </div>
        <div class="form-grid">
          <div class="field"><label>Judul</label><input id="f_title" value="${escapeAttr(row.title||'')}"></div>
          <div class="field"><label>Jenis Media</label><select id="f_mediaType"><option ${row.mediaType==='image'?'selected':''}>image</option><option ${row.mediaType==='video'?'selected':''}>video</option></select></div>
          <div class="field full"><label>File ID Google Drive</label><input id="f_fileId" value="${escapeAttr(row.fileId||'')}"></div>
          <div class="field full"><label>URL Media (jika ada)</label><input id="f_url" value="${escapeAttr(row.url||'')}"></div>
        </div>
        <div class="actions">
          <button class="primary" onclick="saveForm('Gallery','${id||''}')">Simpan</button>
          <button class="secondary" onclick="render('Gallery')">Batal</button>
        </div>
      </div>
    `;
    return;
  }
  if(sheet==='Testimonials'){
    $('#view').innerHTML=`
      <div class="form-card">
        <div class="panel-head" style="margin:0 0 18px">
          <h3>${id?'Ubah Testimoni':'Tambah Testimoni'}</h3>
          <button class="secondary" onclick="render('Testimonials')">← Kembali ke Daftar</button>
        </div>
        <div class="form-grid">
          <div class="field"><label>Nama Pelanggan</label><input id="f_customer" value="${escapeAttr(row.customer||'')}"></div>
          <div class="field"><label>Tampilkan</label><select id="f_published"><option value="true" ${row.published==='true'?'selected':''}>Ya</option><option value="false" ${row.published!=='true'?'selected':''}>Tidak</option></select></div>
          <div class="field full"><label>Isi Testimoni</label><textarea id="f_quote">${escapeHtml(row.quote||'')}</textarea></div>
        </div>
        <div class="actions">
          <button class="primary" onclick="saveForm('Testimonials','${id||''}')">Simpan Testimoni</button>
          <button class="secondary" onclick="render('Testimonials')">Batal</button>
        </div>
      </div>
    `;
    return;
  }
  alert('Modul ini belum didukung form edit.');
  render(sheet);
}
function previewImg(input){
  const p=$('#imgPreview');
  if(!p) return;
  p.innerHTML='';
  if(input.files&&input.files[0]){
    const r=new FileReader();
    r.onload=e=>{p.innerHTML=`<img src="${e.target.result}" style="max-width:260px;border-radius:14px;border:1px solid var(--line);box-shadow:0 40px 60px -50px rgba(23,25,20,.9)">`;};
    r.readAsDataURL(input.files[0]);
  }
}
async function saveForm(sheet,id){
  try{
    const record={};
    if(id && String(id).trim() !== '') record.id=id;
    if(sheet==='Products'){
      ['category','name','species','sex','age','type','price','status','featured','description','parentage','photoIds','videoUrl','audioUrl'].forEach(k=>{
        const el=$('#f_'+k); if(el){
          if(k==='price') record[k]=el.value===''?0:Number(el.value);
          else record[k]=el.value;
        }
      });
    }else if(sheet==='Articles'){
      ['title','excerpt','content','coverId','published'].forEach(k=>{const el=$('#f_'+k); if(el) record[k]=el.value;});
    }else if(sheet==='Gallery'){
      ['title','mediaType','fileId','url'].forEach(k=>{const el=$('#f_'+k); if(el) record[k]=el.value;});
    }else if(sheet==='Testimonials'){
      ['customer','quote','published'].forEach(k=>{const el=$('#f_'+k); if(el) record[k]=el.value;});
    }
    const file=$('#mediaFile')?.files[0];
    if(file && sheet==='Products'){
      const data=await toBase64(file);
      const uploaded=await call('adminUpload',PIN,file.name,file.type,data);
      const existing = record.photoIds ? String(record.photoIds).split(',').filter(Boolean) : [];
      record.photoIds = [...existing, uploaded.id].filter(Boolean).join(',');
    }
    await call('adminSave',PIN,sheet,record);
    await refresh();
    render(sheet);
    alert('Data berhasil disimpan');
  }catch(e){alert(e.message||e);}
}
function toBase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result.split(',')[1]);
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}
async function removeRow(sheet,id){
  if(!confirm('Yakin ingin menghapus data ini?')) return;
  try{
    await call('adminDelete',PIN,sheet,id);
    await refresh();
    render(sheet);
    alert('Data berhasil dihapus');
  }catch(e){alert(e.message||e);}
}
function settings(){
  const s=DATA.settings||{};
  const keys=['farmName','whatsapp','address','openingHours','instagram','facebook','bannerText'];
  $('#view').innerHTML=`
    <div class="form-card settings-grid">
      <div class="panel-head" style="margin:0">
        <h3>Pengaturan Identitas & Kontak</h3>
      </div>
      <div class="form-grid">
        ${keys.map(k=>`<div class="field ${k==='bannerText'?'full':''}"><label>${k}</label><input id="s_${k}" value="${escapeAttr(s[k]||'')}"></div>`).join('')}
      </div>
      <div class="actions">
        <button class="primary" onclick="saveSettings()">Simpan Pengaturan</button>
      </div>
    </div>
    <p class="notice">Nomor WhatsApp pakai format internasional tanpa tanda + (contoh: 628xxxxxxxxxx).</p>
  `;
}
async function saveSettings(){
  const obj={};
  document.querySelectorAll('[id^="s_"]').forEach(el=>obj[el.id.slice(2)]=el.value);
  try{
    await call('adminSaveSettings',PIN,obj);
    await refresh();
    alert('Pengaturan berhasil disimpan');
  }catch(e){alert(e.message||e);}
}
function pageContent(){
  const pc=DATA.pageContent||{};
  const fields=[
    ['announcement','Teks Pengumuman (Header)','html'],
    ['hero_eyebrow','Hero - Eyebrow','text'],
    ['hero_title','Hero - Judul Utama','html'],
    ['hero_desc','Hero - Deskripsi','text'],
    ['hero_btn_catalog','Hero - Tombol "Jelajahi katalog"','html'],
    ['hero_btn_wa','Hero - Tombol WhatsApp','text'],
    ['hero_foot_left','Hero - Teks Kiri Bawah','text'],
    ['hero_foot_right','Hero - Teks Kanan Bawah','text'],
    ['hero_photo','Hero - URL Gambar Utama','text'],
    ['hero_photo_note','Hero - Catatan Foto','html'],
    ['hero_stamp','Hero - Stempel Bulat','html'],
    ['catalog_eyebrow','Katalog - Eyebrow','text'],
    ['catalog_title','Katalog - Judul','html'],
    ['catalog_aside','Katalog - Teks Samping','text'],
    ['farm_eyebrow','Tentang Peternakan - Eyebrow','text'],
    ['farm_title','Tentang Peternakan - Judul','html'],
    ['farm_desc','Tentang Peternakan - Deskripsi','text'],
    ['farm_link','Tentang Peternakan - Teks Link','text'],
    ['farm_image','Tentang Peternakan - URL Gambar','text'],
    ['journal_eyebrow','Catatan Perawatan - Eyebrow','text'],
    ['journal_title','Catatan Perawatan - Judul','html'],
    ['journal_aside','Catatan Perawatan - Teks Samping','text'],
    ['contact_eyebrow','Kontak - Eyebrow','text'],
    ['contact_title','Kontak - Judul','html'],
    ['contact_btn','Kontak - Tombol','html'],
    ['footer_text','Footer - Teks','text']
  ];
  $('#view').innerHTML=`
    <div class="form-card">
      <div class="panel-head" style="margin:0">
        <h3>Pengaturan Tampilan Website</h3>
      </div>
      <p class="notice">Semua perubahan langsung terlihat di halaman publik. Gunakan <code>&lt;br&gt;</code> atau <code>&lt;em&gt;</code> untuk memformat teks.</p>
      <div class="form-grid">
        ${fields.map(([key,label,type])=>`<div class="field ${type==='html'?'full':''}"><label>${label}</label>${type==='html'?`<textarea id="pc_${key}">${escapeHtml(pc[key]||'')}</textarea>`:`<input id="pc_${key}" value="${escapeAttr(pc[key]||'')}">`}</div>`).join('')}
      </div>
      <div class="actions">
        <button class="primary" onclick="savePageContent()">Simpan Tampilan Website</button>
      </div>
    </div>
  `;
}
async function savePageContent(){
  const obj={};
  document.querySelectorAll('[id^="pc_"]').forEach(el=>obj[el.id.slice(3)]=el.value);
  try{
    if(window.google && google.script && google.script.run){
      await call('adminSavePageContent',PIN,obj);
    }else if(DATA.API_URL){
      await fetch(DATA.API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:PIN,action:'pageContent',pageContent:obj})});
    }
    await refresh();
    alert('Tampilan website berhasil disimpan!');
  }catch(e){
    alert(e.message||e);
  }
}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escapeAttr(v){return escapeHtml(v);}
</script>
